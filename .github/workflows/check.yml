name: Source checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s port/tests -v
      - run: python -m compileall -q tools port/tools
      - run: for script in *.sh; do sh -n "$script"; done
